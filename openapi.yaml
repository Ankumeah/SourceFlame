openapi: 3.1.0
info:
  title: SourceFlame routes
  version: "v0.3.0"

servers:
  - url: http://localhost:8000

security: []

paths:
  /:
    get:
      operationId: getRoot
      responses:
        "200":
          description: Success

  /r/{user}/{repo}:
    get:
      operationId: getRepository
      parameters:
        - $ref: "#/components/parameters/User"
        - $ref: "#/components/parameters/Repo"
      responses:
        "200":
          description: Success

  /r/{user}/{repo}/info/refs:
    get:
      operationId: gitRefs
      parameters:
        - $ref: "#/components/parameters/User"
        - $ref: "#/components/parameters/Repo"
        - $ref: "#/components/parameters/GitService"
      responses:
        "200":
          description: Git service advertisement

  /r/{user}/{repo}/git-upload-pack:
    post:
      operationId: gitUploadPack
      parameters:
        - $ref: "#/components/parameters/User"
        - $ref: "#/components/parameters/Repo"
      requestBody:
        $ref: "#/components/requestBodies/UploadPackRequest"
      responses:
        "200":
          $ref: "#/components/responses/UploadPackResponse"

  /r/{user}/{repo}/git-receive-pack:
    post:
      operationId: gitReceivePack
      security:
        - basicAuth: []
      parameters:
        - $ref: "#/components/parameters/User"
        - $ref: "#/components/parameters/Repo"
      requestBody:
        $ref: "#/components/requestBodies/ReceivePackRequest"
      responses:
        "200":
          $ref: "#/components/responses/ReceivePackResponse"

  /r/{user}/{repo}/refs:
    get:
      operationId: listRefs
      parameters:
        - $ref: "#/components/parameters/User"
        - $ref: "#/components/parameters/Repo"
      responses:
        "200":
          description: Repository refs

  /r/{user}/{repo}/blob/{file}:
    get:
      operationId: getBlob
      parameters:
        - $ref: "#/components/parameters/User"
        - $ref: "#/components/parameters/Repo"
        - $ref: "#/components/parameters/Ref"
        - name: file
          in: path
          required: true
          description: File path; may include nested directories.
          schema:
            type: string
      responses:
        "200":
          description: File contents

  /r/{user}/{repo}/git-log:
    get:
      operationId: getGitLog
      parameters:
        - $ref: "#/components/parameters/User"
        - $ref: "#/components/parameters/Repo"
        - $ref: "#/components/parameters/Ref"
      responses:
        "200":
          description: Repository commit history

  /r/{user}/{repo}/tree/{dir}:
    get:
      operationId: getTree
      parameters:
        - $ref: "#/components/parameters/User"
        - $ref: "#/components/parameters/Repo"
        - $ref: "#/components/parameters/Ref"
        - name: dir
          in: path
          required: true
          description: Directory path; may include nested directories.
          schema:
            type: string
      responses:
        "200":
          description: Directory contents

  /r/{user}/{repo}/pr:
    post:
      operationId: createPullRequest
      security:
        - basicAuth: []
      parameters:
        - $ref: "#/components/parameters/User"
        - $ref: "#/components/parameters/Repo"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequestInput"
            example:
              title: Add example feature
              body: |-
                This is a sample pull request with dummy data.

                stuff	some does studd
              url: test-url.com
      responses:
        "200":
          description: Success

    get:
      operationId: listPullRequests
      parameters:
        - $ref: "#/components/parameters/User"
        - $ref: "#/components/parameters/Repo"
        - name: page
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Pull requests

  /api/ping:
    get:
      operationId: ping
      responses:
        "200":
          description: Success

  /api/acc:
    post:
      operationId: createAccount
      security:
        - basicAuth: []
      responses:
        "200":
          description: Success
    delete:
      operationId: deleteAccount
      security:
        - basicAuth: []
      responses:
        "200":
          description: Success

  /api/repos/{repo}:
    post:
      operationId: createRepository
      security:
        - basicAuth: []
      parameters:
        - $ref: "#/components/parameters/Repo"
      responses:
        "200":
          description: Success
    delete:
      operationId: deleteRepository
      security:
        - basicAuth: []
      parameters:
        - $ref: "#/components/parameters/Repo"
      responses:
        "200":
          description: Success

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  parameters:
    User:
      name: user
      in: path
      required: true
      schema:
        type: string

    Repo:
      name: repo
      in: path
      required: true
      schema:
        type: string

    Ref:
      name: ref
      in: query
      required: true
      schema:
        type: string

    GitService:
      name: service
      in: query
      required: true
      schema:
        type: string
        enum:
          - git-receive-pack
          - git-upload-pack

  schemas:
    PullRequestInput:
      type: object
      required:
        - title
        - body
        - url
      properties:
        title:
          type: string
        body:
          type: string
        url:
          type: string

  requestBodies:
    UploadPackRequest:
      required: true
      content:
        application/x-git-upload-pack-request:
          schema:
            type: string
            format: binary

    ReceivePackRequest:
      required: true
      content:
        application/x-git-receive-pack-request:
          schema:
            type: string
            format: binary

  responses:
    UploadPackResponse:
      description: Git upload-pack response
      content:
        application/x-git-upload-pack-result:
          schema:
            type: string
            format: binary

    ReceivePackResponse:
      description: Git receive-pack response
      content:
        application/x-git-receive-pack-result:
          schema:
            type: string
            format: binary
