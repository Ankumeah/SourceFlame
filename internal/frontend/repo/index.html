<!DOCTYPE html>
<html lang="en">

<head>
  <title>SourceFlame</title>

  <link rel="stylesheet" href="styles.css">
  <script src="script.js"></script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
  <h1 id="repo-name">Loading repo...</h1>
  <hr>
  <br>

  <div id="info">
    <div id="meta-box">
      <code class="code-block" id="clone-link">Loading clone link...</code>

      <select id="ref-selector" name="ref-selector">
        <option value="" selected disabled>Loading refs...</option>
      </select>
    </div>
    <br>

    <a href="prs">PRs</a>

    <h3 id="readme-heading">README.md</h3>
    <code class="code-block" id="readme">Loading README...</code>

    <br>
    <details id="log-box">
      <summary>
        <h3>Log</h3>
      </summary>
      <br>
      <code class="code-block" id="log">Loading log...</code>
    </details>

    <br>
    <details id="tree-box">
      <summary>
        <h3>Tree</h3>
      </summary>
      <br>
      <code class="code-block" id="tree">Loading tree...</code>
    </details>
  </div>
</body>

</html>
