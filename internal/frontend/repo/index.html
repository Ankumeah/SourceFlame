<!DOCTYPE html>
<html lang="en">

<head>
  <title>SourceFlame</title>

  <link rel="stylesheet" href="styles.css">
  <script src="script.js"></script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
  <h1 id="repo-name">Loading repo...</h1>
  <hr>
  <br>

  <div id="meta-box">
    <label for="ref-selector"><code class="code-block" id="clone-link">Loading clone link...</code></label>
    <select id="ref-selector" name="ref-selector">
      <option value="" selected disabled>Loading refs...</option>
    </select>
  </div>
  <br>

  <h3>README.md</h3>
  <pre class="code-block"><code id="readme">Loading README...</code></pre>
</body>

</html>
