<!DOCTYPE html>
<html lang="en">

<head>
  <title>SourceFlame</title>

  <link rel="stylesheet" href="styles.css">
  <script src="script.js"></script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
  <h1 id="repo-name">Loading repo...</h1>
  <hr>
  <br>

  <div id="info">
    <div id="meta-box">
      <code class="code-block" id="clone-link">Loading clone link...</code>

      <select id="ref-selector" name="ref-selector">
        <option value="" selected disabled>Loading refs...</option>
      </select>
    </div>
    <br>

    <h3>README.md</h3>
    <div class="code-block">
      <code id="readme">Loading README...</code>
    </div>

    <h3>Log</h3>
    <div class="code-block">
      <code id="log">Loading log...</code>
    </div>
  </div>
</body>

</html>
